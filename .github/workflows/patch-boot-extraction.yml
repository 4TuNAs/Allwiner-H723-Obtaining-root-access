name: One-time README boot extraction patch

on:
  push:
    paths:
      - '.github/patch_boot_extraction.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README
        run: python .github/patch_boot_extraction.py
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Document extraction of stock boot images'
          git push
